services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    ports: ["5432:5432"]
    volumes: ["catalog_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/catalog
      DATABASE_USERNAME: catalog
      DATABASE_PASSWORD: catalog
    depends_on:
      db:
        condition: service_healthy
volumes:
  catalog_data:
